# DrowsyGuard CAN Interface Control Document — canonical machine-readable source.
#
# specs/02-development-standards.md DEV-002: this file SHALL be the only
# place message layouts are written; the C header and the Python module
# SHALL be generated from it by generate.py.
#
# **Current status: this file is documentation, not yet a code-generation
# input.** `generate.py` does not exist. The two implementations it should
# generate already exist, hand-written from specs/04-interface-control-document.md:
#   - vcs-mcxn947/src/icd/icd.h + icd.c   (C, VCS side)
#   - dms-ap/src/drowsyguard/link/icd.py   (Python, DMS-AP side)
# They agree today because both were written directly from spec 04 and are
# checked against the same crc_vectors.csv in this directory. That is a
# weaker guarantee than "cannot disagree" (DEV-002's actual goal) — until
# generate.py exists, changing a field in one without the other is a defect
# that nothing catches automatically. This file exists so that gap has a
# clear shape: writing generate.py means teaching it to read this file and
# emit both of the hand-written files above byte-for-byte.
#
# Field order, sizes and bit positions below are normative and MUST match
# specs/04-interface-control-document.md exactly.

physical:
  protocol: "Classical CAN 2.0A, 11-bit standard identifiers"
  bitrate_bps: 500000
  sample_point_pct: 87.5

crc:
  algorithm: "CRC-8 SAE-J1850"
  poly: 0x1D
  init: 0xFF
  xorout: 0xFF
  test_vectors: crc_vectors.csv

messages:
  - name: EMERGENCY_STOP
    id: 0x080
    direction: "either -> either"
    dlc: 2
    cycle: "event, repeated 3x @ 10 ms"
    fields:
      - {name: reason, byte: 0, bits: "7:0", type: u8, enum: EstopReason}
      - {name: magic, byte: 1, bits: "7:0", type: u8, const: 0x5A}

  - name: DMS_STATUS
    id: 0x100
    direction: "DMS -> VCS"
    dlc: 8
    cycle_ms: 100
    fields:
      - {name: alert_level, byte: 0, bits: "3:0", type: u4, enum: AlertLevel}
      - {name: seq, byte: 0, bits: "7:4", type: u4}
      - {name: d1_state, byte: 1, bits: "1:0", type: u2, enum: DomainWireState}
      - {name: d2_state, byte: 1, bits: "3:2", type: u2, enum: DomainWireState}
      - {name: d3_state, byte: 1, bits: "5:4", type: u2, enum: DomainWireState}
      - {name: d3_avail, byte: 1, bits: "7:6", type: u2, enum: D3Availability}
      - {name: perclos_pct, byte: 2, bits: "7:0", type: u8, invalid: 255}
      - {name: eye_closure_ms, byte: "3-4", bits: "15:0", type: u16le, invalid: 65535}
      - {name: face_conf_pct, byte: 5, bits: "7:0", type: u8, invalid: 255}
      - {name: flag_ack_refractory, byte: 6, bits: "0", type: bool}
      - {name: flag_sensor_lost, byte: 6, bits: "1", type: bool}
      - {name: flag_model_degraded, byte: 6, bits: "2", type: bool}
      - {name: flag_night_mode, byte: 6, bits: "3", type: bool}
      - {name: flag_calib_done, byte: 6, bits: "4", type: bool}
      - {name: flag_pipeline_slow, byte: 6, bits: "5", type: bool}
      - {name: flag_ack_saturated, byte: 6, bits: "6", type: bool}
      - {name: crc8, byte: 7, bits: "7:0", type: u8, crc_over: "bytes 0-6"}

  - name: DMS_METRICS
    id: 0x101
    direction: "DMS -> VCS"
    dlc: 8
    cycle_ms: 500
    note: "telemetry only, never influences VCS actuation"
    fields:
      - {name: fps_x10, byte: 0, bits: "7:0", type: u8}
      - {name: inference_ms, byte: 1, bits: "7:0", type: u8, saturating: true}
      - {name: yawn_count, byte: 2, bits: "7:0", type: u8}
      - {name: eor_cum_ms, byte: "3-4", bits: "15:0", type: u16le}
      - {name: dropped_pct, byte: 5, bits: "7:0", type: u8}
      - {name: seq, byte: 6, bits: "7:0", type: u8}
      - {name: crc8, byte: 7, bits: "7:0", type: u8, crc_over: "bytes 0-6"}

  - name: VCS_STATUS
    id: 0x200
    direction: "VCS -> DMS"
    dlc: 8
    cycle_ms: 100
    fields:
      - {name: vehicle_state, byte: 0, bits: "3:0", type: u4, enum: VehicleState}
      - {name: seq, byte: 0, bits: "7:4", type: u4}
      - {name: speed_cap_pct, byte: 1, bits: "7:0", type: u8}
      - {name: duty_left_pct, byte: 2, bits: "6:0", type: u7}
      - {name: dir_left_reverse, byte: 2, bits: "7", type: bool}
      - {name: duty_right_pct, byte: 3, bits: "6:0", type: u7}
      - {name: dir_right_reverse, byte: 3, bits: "7", type: bool}
      - {name: fault_driver, byte: 4, bits: "0", type: bool}
      - {name: fault_watchdog_reset, byte: 4, bits: "1", type: bool}
      - {name: fault_can_timeout, byte: 4, bits: "2", type: bool}
      - {name: fault_undervoltage, byte: 4, bits: "3", type: bool}
      - {name: estop_active, byte: 4, bits: "4", type: bool}
      - {name: indicator_active, byte: 4, bits: "5", type: bool}
      - {name: indicator_dir, byte: 4, bits: "7:6", type: u2, values: "0 none, 1 left, 2 right"}
      - {name: uptime_s, byte: "5-6", bits: "15:0", type: u16le, saturating: true}
      - {name: crc8, byte: 7, bits: "7:0", type: u8, crc_over: "bytes 0-6"}

  - name: VCS_EVENT
    id: 0x201
    direction: "VCS -> DMS"
    dlc: 2
    cycle: "event, repeated 3x @ 10 ms, de-duplicated on event_seq"
    fields:
      - {name: event_id, byte: 0, bits: "7:0", type: u8, enum: EventId}
      - {name: event_seq, byte: 1, bits: "7:0", type: u8}

  - name: DIAG_REQ
    id: 0x700
    direction: "DMS -> VCS"
    dlc: 8
    cycle: "on request"
    status: "not implemented (spec 04 §2, lowest priority)"

  - name: DIAG_RESP
    id: 0x701
    direction: "VCS -> DMS"
    dlc: 8
    cycle: "on request"
    status: "not implemented (spec 04 §2, lowest priority)"

enums:
  AlertLevel: {L0_NORMAL: 0, L1_EARLY: 1, L2_DROWSY: 2, L3_DANGER: 3}
  DomainWireState: {IDLE: 0, ACTIVE: 1, SEVERE: 2, CRITICAL: 3}
  D3Availability: {AVAILABLE: 0, DEGRADED: 1, UNAVAILABLE: 2}
  VehicleState:
    INIT: 0
    DISARMED: 1
    ARMED_IDLE: 2
    RUN: 3
    LIMITED: 4
    DECEL: 5
    STOPPED: 6
    LINK_LOST: 7
    FAULT: 8
    ESTOP: 9
  EventId:
    ACK: 1
    OPERATOR_REARM: 2
    ESTOP_ASSERTED: 3
    ESTOP_RELEASED: 4
    INDICATOR_ON: 5
    INDICATOR_OFF: 6
  EstopReason: {PHYSICAL: 1, DMS_FAULT: 2, VCS_FAULT: 3, OPERATOR: 4}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DrowsyGuard — Cluster Mockup</title>
<style>
  :root{
    --bg:#0a0d13;
    --panel:#0f1420;
    --navy:#13223f;
    --navy-2:#0c1a33;
    --hairline:rgba(255,255,255,0.08);
    --text-dim:#7c8aa5;
    --text:#eef2f9;
    --gold:#e8a33d;
    --l1:#f2b544;
    --l2:#ff8c2e;
    --l3:#ff3b3b;
    --green-ok:#3ddc84;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:1280px;height:720px;
    background:#000;
    font-family:"Helvetica Neue", Arial, "Segoe UI", sans-serif;
    overflow:hidden;
  }
  .cluster{
    position:relative;
    width:1280px;height:720px;
    background:
      radial-gradient(120% 100% at 50% 15%, #101a2c 0%, var(--bg) 55%),
      var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    isolation:isolate;
  }

  /* ---------- top strip ---------- */
  .top-strip{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 46px 14px 46px;
    z-index:2;
  }
  .top-left, .top-right{display:flex;align-items:center;gap:28px;}
  .wordmark{
    font-weight:800;letter-spacing:3px;font-size:15px;color:var(--gold);
    display:flex;align-items:center;gap:8px;
  }
  .wordmark .dot{width:7px;height:7px;border-radius:50%;background:var(--green-ok);
    box-shadow:0 0 8px 1px var(--green-ok);}
  .indicator{
    display:flex;align-items:center;gap:8px;color:var(--text-dim);
    font-size:13px;letter-spacing:1px;
  }
  .indicator svg{width:18px;height:18px;opacity:.85;}
  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);
    border:1px solid var(--hairline);
    padding:7px 16px;border-radius:999px;
    font-size:12px;letter-spacing:2px;color:var(--text-dim);
    font-weight:600;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green-ok);}
  .night-pill{display:flex;align-items:center;gap:7px;color:var(--text-dim);font-size:12px;letter-spacing:1.5px;font-weight:600;}
  .night-pill svg{width:15px;height:15px;color:#cfe0ff;opacity:.85;}

  /* ---------- big clock dock, beside the speedometer ---------- */
  .clock-dock{
    position:absolute; right:46px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    z-index:2;
  }
  .clock-dock .moon-row{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
  .clock-dock .moon-row svg{width:20px;height:20px;color:#cfe0ff;opacity:.9;}
  .clock-dock .moon-row .lbl{font-size:13px;letter-spacing:3px;font-weight:700;color:#cfe0ff;}
  .clock-dock .time{
    font-size:76px;font-weight:800;line-height:1;letter-spacing:-1px;
    font-variant-numeric:tabular-nums; color:var(--text);
    text-shadow:0 0 24px rgba(207,224,255,.18);
  }
  .clock-dock .date{font-size:14px;letter-spacing:2px;color:var(--text-dim);font-weight:600;}

  /* ---------- night sky ambience ---------- */
  .stars{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;}
  .stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#cfe0ff; box-shadow:0 0 3px 1px rgba(207,224,255,.6);
  }

  /* ---------- left app dock ---------- */
  .app-dock{
    position:absolute; left:30px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:20px; z-index:2;
  }
  .app-icon{
    width:64px;height:64px;border-radius:17px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, #141b2b, #0d1220);
    border:1px solid var(--hairline);
    box-shadow:0 2px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
    color:#9fb0cc;
  }
  .app-icon svg{width:29px;height:29px;}
  .app-icon.accent{
    color:#151a10;
    background:linear-gradient(160deg, #f2c15c, var(--gold));
    box-shadow:0 2px 14px rgba(232,163,61,.45);
  }

  /* ---------- gauge ---------- */
  .gauge-wrap{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    z-index:2;
    transition:filter .35s ease;
  }
  .gauge{ width:520px;height:520px; position:relative; }
  .gauge svg{ width:100%;height:100%; overflow:visible; }
  .tick{ stroke:var(--text-dim); stroke-width:2; opacity:.55; }
  .tick.major{ stroke:var(--text); opacity:.85; stroke-width:3; }
  .tick-label{
    fill:var(--text-dim); font-size:20px; font-weight:600;
    font-family:"Helvetica Neue", Arial, sans-serif;
    text-anchor:middle;
  }
  .arc-track{ fill:none; stroke:rgba(255,255,255,0.06); stroke-width:14; stroke-linecap:round; }
  .arc-fill{ fill:none; stroke:var(--gold); stroke-width:14; stroke-linecap:round;
    transition:stroke .35s ease; filter:drop-shadow(0 0 6px rgba(232,163,61,.45)); }
  .needle{
    position:absolute; left:50%; top:50%;
    width:4px; height:190px;
    background:linear-gradient(to top, transparent 0%, var(--text) 18%, var(--text) 100%);
    transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(var(--needle-angle, -30deg));
    border-radius:3px;
    box-shadow:0 0 10px rgba(255,255,255,.35);
    transition:transform .5s cubic-bezier(.3,1,.4,1), background .35s ease;
    z-index:3;
  }
  .hub{
    position:absolute; left:50%; top:50%; width:22px; height:22px;
    background:radial-gradient(circle at 35% 30%, #3a4a68, #10192a 70%);
    border:2px solid var(--hairline);
    border-radius:50%; transform:translate(-50%,-50%); z-index:4;
  }
  .readout{
    position:absolute; left:50%; top:64%;
    transform:translate(-50%,0);
    text-align:center; z-index:3;
  }
  .readout .num{
    font-size:96px; font-weight:800; line-height:1;
    letter-spacing:-2px; font-variant-numeric:tabular-nums;
    color:var(--text);
    transition:color .35s ease;
  }
  .readout .unit{
    margin-top:2px;
    font-size:15px; letter-spacing:5px; color:var(--text-dim); font-weight:600;
  }

  /* ---------- bottom indicator row ---------- */
  .indicator-row{
    display:flex; align-items:center; justify-content:center; gap:64px;
    padding:8px 0 28px 0;
    z-index:2;
  }
  .lamp{ display:flex;flex-direction:column;align-items:center;gap:6px; opacity:.28; }
  .lamp svg{width:26px;height:26px;}
  .lamp.on{opacity:1;}
  .lamp.on.green svg{ color:var(--green-ok); filter:drop-shadow(0 0 6px rgba(61,220,132,.6)); }
  .lamp .lbl{font-size:10px;letter-spacing:1.5px;color:var(--text-dim);}

  /* ================= ALERT LAYER ================= */
  .alert-layer{ position:absolute; inset:0; z-index:10; pointer-events:none; }

  /* L1 : slim advisory banner */
  .banner-l1{
    position:absolute; top:0; left:0; right:0;
    display:none;
    align-items:center; justify-content:center; gap:14px;
    padding:16px 0;
    background:linear-gradient(180deg, rgba(242,181,68,.97), rgba(242,181,68,.86));
    color:#231602;
    font-weight:700; letter-spacing:1.5px; font-size:18px;
    box-shadow:0 6px 24px rgba(242,181,68,.35);
  }
  .banner-l1 svg{width:22px;height:22px;}

  /* L2 : persistent warning banner + tint */
  .banner-l2{
    position:absolute; top:0; left:0; right:0;
    display:none;
    align-items:center; justify-content:center; gap:14px;
    padding:18px 0;
    background:linear-gradient(180deg, rgba(255,140,46,.97), rgba(255,140,46,.88));
    color:#2a1400;
    font-weight:800; letter-spacing:1.5px; font-size:19px;
    box-shadow:0 6px 28px rgba(255,140,46,.45);
  }
  .banner-l2 svg{width:24px;height:24px;}
  .tint-l2{
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 10%, rgba(255,140,46,.16), rgba(255,140,46,0) 60%);
    display:none;
  }
  .ring-l2{
    position:absolute; inset:14px;
    border-radius:26px;
    border:2px solid rgba(255,140,46,.55);
    box-shadow:0 0 0 1px rgba(255,140,46,.15) inset, 0 0 40px rgba(255,140,46,.25);
    display:none;
  }

  /* L3 : full danger takeover */
  .flash-l3{
    position:absolute; inset:0;
    background:rgba(255,40,40,.30);
    display:none;
  }
  .ring-l3{
    position:absolute; inset:10px;
    border-radius:28px;
    border:3px solid rgba(255,59,59,.9);
    box-shadow:0 0 0 2px rgba(255,59,59,.25) inset, 0 0 60px rgba(255,59,59,.55);
    display:none;
  }
  .modal-l3{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column; gap:18px;
    background:rgba(8,3,3,.55);
  }
  .modal-l3 .icon{width:88px;height:88px;color:#ff3b3b;
    filter:drop-shadow(0 0 18px rgba(255,59,59,.7));}
  .modal-l3 .title{
    font-size:34px; font-weight:900; letter-spacing:3px; color:#fff;
    text-shadow:0 0 20px rgba(255,59,59,.8);
  }
  .modal-l3 .sub{
    font-size:16px; letter-spacing:2px; color:#ffcccc; font-weight:600;
  }

  /* animations, disabled when .still is present on body */
  @keyframes flashRed{
    0%,100%{opacity:.85;} 50%{opacity:.35;}
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 1px rgba(255,140,46,.15) inset, 0 0 40px rgba(255,140,46,.25);}
    50%{box-shadow:0 0 0 1px rgba(255,140,46,.3) inset, 0 0 62px rgba(255,140,46,.5);}
  }
  body:not(.still) .flash-l3{ animation:flashRed 1s ease-in-out infinite; }
  body:not(.still) .ring-l2{ animation:pulseGlow 1.6s ease-in-out infinite; }

  /* ================= level state switches ================= */
  body.level-l1 .banner-l1{ display:flex; }

  body.level-l2 .banner-l2{ display:flex; }
  body.level-l2 .tint-l2{ display:block; }
  body.level-l2 .ring-l2{ display:block; }
  body.level-l2 .gauge-wrap{ filter:saturate(1.05); }
  body.level-l2 .arc-fill{ stroke:var(--l2); filter:drop-shadow(0 0 8px rgba(255,140,46,.55)); }
  body.level-l2 .needle{ background:linear-gradient(to top, transparent 0%, var(--l2) 18%, var(--l2) 100%); }
  body.level-l2 .readout .num{ color:#ffb066; }

  body.level-l3 .flash-l3{ display:block; }
  body.level-l3 .ring-l3{ display:block; }
  body.level-l3 .modal-l3{ display:flex; }
  body.level-l3 .arc-fill{ stroke:var(--l3); }
  body.level-l3 .needle{ background:linear-gradient(to top, transparent 0%, var(--l3) 18%, var(--l3) 100%); }

  /* dev-only controls, hidden in screenshot mode */
  .devbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; gap:8px; padding:10px; background:#111; z-index:99;
    font-family:monospace;
  }
  body.shot .devbar{ display:none; }
  .devbar button{
    background:#222;color:#eee;border:1px solid #444;border-radius:6px;
    padding:8px 14px;cursor:pointer;font-size:12px;letter-spacing:1px;
  }
  .devbar button.active{ background:var(--gold); color:#000; border-color:var(--gold); }
</style>
</head>
<body>

<div class="cluster">
  <div class="stars" id="stars"></div>

  <div class="app-dock">
    <div class="app-icon accent" title="Phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.5 2.1L8 9.7a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.5c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/></svg>

      </div>

    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">MONITORING</span></div>
    <div class="top-right">
      <div class="night-pill">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>

      </div>
    </div>
  </div>

  <div class="clock-dock">
    <div class="moon-row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>

  <div class="gauge-wrap">

      <svg viewBox="0 0 400 400">
        <!-- arc track/fill paths + ticks are all generated in JS from the same
             cx/cy/r/startDeg/sweepDeg constants below, so they can never drift
             out of alignment with each other. -->
        <path class="arc-track" id="arcTrack" />
        <path class="arc-fill" id="arcFill" />

      </svg>

<div class="devbar">
  <button data-level="idle">L0 · IDLE</button>
  <button data-level="l1">L1 · ADVISORY</button>
  <button data-level="l2">L2 · WARNING</button>
  <button data-level="l3">L3 · DANGER</button>

<script>
  // Sprinkle a few faint "stars" across the upper half of the cluster to sell
  // the night-mode ambience (purely decorative, no data behind it).
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 55 + '%';
    s.style.opacity = (0.25 + Math.random() * 0.6).toFixed(2);
    starsEl.appendChild(s);
  }

  // Gauge geometry, single source of truth for ticks + arc + needle.
  // Angle convention: 0deg = screen-right, 90deg = screen-down, 270deg = screen-up
  // (standard SVG y-down trig). Sweeping 135deg -> 405deg (=45deg) goes the LONG
  // way around through the top, leaving a 90deg open gap at the bottom, which is
  // the classic automotive speedometer shape (0 at lower-left, max at lower-right).
  const ticksG = document.getElementById('ticks');
  const cx = 200, cy = 200, rOuter = 160, rInner = 142, rLabel = 118;
  const maxSpeed = 160, startDeg = 135, sweepDeg = 270;
  function toXY(deg, r){
    const rad = (deg * Math.PI) / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  function arcPath(fromDeg, toDeg, r){
    const [x1,y1] = toXY(fromDeg, r);
    const [x2,y2] = toXY(toDeg, r);
    const large = (toDeg - fromDeg) % 360 > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
  }
  const arcTrackEl = document.getElementById('arcTrack');
  const arcFillEl = document.getElementById('arcFill');
  arcTrackEl.setAttribute('d', arcPath(startDeg, startDeg + sweepDeg, rOuter));
  arcFillEl.setAttribute('d', arcPath(startDeg, startDeg + sweepDeg, rOuter));
  const arcTotalLen = arcTrackEl.getTotalLength();

  for(let v=0; v<=maxSpeed; v+=20){
    const deg = startDeg + (v/maxSpeed)*sweepDeg;
    const [x1,y1] = toXY(deg, rOuter);
    const [x2,y2] = toXY(deg, rInner);
    const major = (v % 40 === 0);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ticksG.appendChild(line);
    if(major){
      const [lx,ly] = toXY(deg, rLabel);
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', lx); t.setAttribute('y', ly+7);
      t.setAttribute('class','tick-label');
      t.textContent = v;
      ticksG.appendChild(t);
    }
    // one minor tick between majors
    if(v < maxSpeed){
      const midDeg = startDeg + ((v+10)/maxSpeed)*sweepDeg;
      const [mx1,my1] = toXY(midDeg, rOuter);
      const [mx2,my2] = toXY(midDeg, rOuter-12);
      const mline = document.createElementNS('http://www.w3.org/2000/svg','line');
      mline.setAttribute('x1',mx1); mline.setAttribute('y1',my1);
      mline.setAttribute('x2',mx2); mline.setAttribute('y2',my2);
      mline.setAttribute('class','tick');
      ticksG.appendChild(mline);
    }
  }

  function setSpeed(v){
    v = Math.max(0, Math.min(maxSpeed, v));
    document.getElementById('speedNum').textContent = v;
    const pct = v / maxSpeed;
    const needleDeg = startDeg + pct*sweepDeg - 270; // convert to CSS rotate() base (0deg = up)
    document.getElementById('needle').style.setProperty('--needle-angle', needleDeg + 'deg');
    const fillLen = arcTotalLen * pct;
    arcFillEl.setAttribute('stroke-dasharray', fillLen + ' ' + arcTotalLen);
  }
  setSpeed(78);

  function setLevel(level){
    document.body.classList.remove('level-l1','level-l2','level-l3');
    const statusText = document.getElementById('statusText');
    if(level === 'l1'){ document.body.classList.add('level-l1'); statusText.textContent='ADVISORY'; }
    else if(level === 'l2'){ document.body.classList.add('level-l2'); statusText.textContent='WARNING'; }
    else if(level === 'l3'){ document.body.classList.add('level-l3'); statusText.textContent='DANGER'; }
    else { statusText.textContent='MONITORING'; }
    document.querySelectorAll('.devbar button').forEach(b=>{
      b.classList.toggle('active', b.dataset.level === level);
    });
  }

  document.querySelectorAll('.devbar button').forEach(b=>{
    b.addEventListener('click', ()=> setLevel(b.dataset.level));
  });

  // URL params: ?level=idle|l1|l2|l3  &still=1 (freeze animation) &shot=1 (hide devbar)
  const params = new URLSearchParams(location.search);
  setLevel(params.get('level') || 'idle');
  if(params.get('still') === '1') document.body.classList.add('still');
  if(params.get('shot') === '1') document.body.classList.add('shot');
  if(params.get('speed')) setSpeed(parseInt(params.get('speed'),10));
</script>
</body>
</html>

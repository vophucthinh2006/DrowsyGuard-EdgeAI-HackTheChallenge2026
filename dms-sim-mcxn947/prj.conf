# SDK components this test node needs (see ../vcs-mcxn947/prj.conf's header
# comment for why this file has to exist and list every driver used).

# CAN0 link
CONFIG_MCUX_COMPONENT_driver.flexcan=y

# Status LED (link-fresh indicator)
CONFIG_MCUX_COMPONENT_driver.gpio=y

# PORT pin muxing used by board_port/pin_mux.c
CONFIG_MCUX_COMPONENT_driver.port=y

# FreeRTOS kernel (3 tasks: can_test_rx, console_rx, console_tx).
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm33_non_trustzone=y

# SDK Kconfig default (10240) is what vcs-mcxn947's own prj.conf found too
# tight for 6 tasks on this same SDK/board (xTaskCreate() -> pdFAIL on real
# hardware, see that file's comment). This node only creates 3 tasks, but
# 16384 keeps headroom without guessing all the way down to the default.
CONFIG_configTOTAL_HEAP_SIZE=16384

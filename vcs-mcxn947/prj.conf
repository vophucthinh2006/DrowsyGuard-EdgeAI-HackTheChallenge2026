# SDK components this application needs.
#
# The MCUXpresso SDK only compiles the drivers you ask for, so every
# peripheral used by the code has to be switched on here. Forgetting one
# shows up as an "undefined reference" at LINK time, not a compile error
# (specs/02-development-standards.md DEV-031).

# CAN0 link (specs/04-interface-control-document.md)
CONFIG_MCUX_COMPONENT_driver.flexcan=y

# Motor PWM + buzzer tone (specs/05-vehicle-control-spec.md VEH-001/030)
CONFIG_MCUX_COMPONENT_driver.pwm=y

# Status LED, motor direction/STBY, vibration/fan/hazard, buttons
CONFIG_MCUX_COMPONENT_driver.gpio=y

# PORT pin muxing used by board_port/pin_mux.c
CONFIG_MCUX_COMPONENT_driver.port=y

# Watchdog (specs/05 VEH-052/053)
CONFIG_MCUX_COMPONENT_driver.wwdt=y

# FreeRTOS kernel. The SDK build system auto-generates FreeRTOSConfig.h from
# these three lines: base component, dynamic-memory allocator, and the
# Cortex-M33 non-TrustZone port (this board runs without TrustZone).
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm33_non_trustzone=y

[project]
name = "drowsyguard-dms-ap"
version = "0.1.0"
description = "DrowsyGuard DMS application processor (Arduino UNO Q / QRB2210 Linux side)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "tensorflow>=2.16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
drowsyguard = "drowsyguard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drowsyguard"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
# specs/02-development-standards.md DEV-041: strict typing is required only
# on the packages where a type confusion becomes a wrong alert.
files = ["src/drowsyguard/domains", "src/drowsyguard/fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Arduino CLI sketch project file. Auto-managed once opened in App Lab /
# built with arduino-cli -- don't hand-edit after that point. Contents here
# are seeded from a confirmed real UNO Q app
# (ShawnHymel/arduino_uno_q_blink_cli/sketch/sketch.yaml on GitHub), not
# guessed. Note the FQBN: `arduino:zephyr:unoq` -- this board's MCU side
# runs a Zephyr-based Arduino core, not bare-metal STM32duino. That matters
# for sketch.ino's FDCAN section: generic bare-metal STM32 CAN libraries
# target a different core and may not apply here.
profiles:
  default:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.1)
default_profile: default
